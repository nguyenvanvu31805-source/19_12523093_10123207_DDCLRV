services:
  mongodb:
    image: mongo:7
    container_name: wine-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ai-service:
    build:
      context: .
      dockerfile: ai-models/service/Dockerfile
    image: wine-quality-ai-service
    container_name: wine-ai-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    image: wine-quality-backend
    container_name: wine-backend
    ports:
      - "5000:5000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=wine_quality_db
      - MONGODB_COLLECTION=predictions
    depends_on:
      ai-service:
        condition: service_healthy
      mongodb:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: wine-frontend
    ports:
      - "3000:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
      - ./app/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: wine-quality-network

volumes:
  mongodb_data:

