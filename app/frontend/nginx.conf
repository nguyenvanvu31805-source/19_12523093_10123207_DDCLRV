server {
    listen 80;
    server_name localhost;

    # 1. Phục vụ các tệp tĩnh Frontend (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy cho toàn bộ API Backend qua tiền tố /api/
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # Chuyển tiếp các HTTP header chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bảo toàn header truy vết Request ID xuyên suốt luồng
        proxy_set_header X-Request-ID $http_x_request_id;

        # Cấu hình timeout cho các tác vụ suy luận
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Hỗ trợ tương thích ngược cho endpoint /predict
    location /predict {
        proxy_pass http://backend:5000/predict;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
